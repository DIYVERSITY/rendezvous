[tool.poetry]
name = "agentic-backend"
version = "0.1.0"
description = "FastAPI orchestrator and agent microservices for Coral agentic workflows"
authors = ["Richard Ahn"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
fastapi-cache2 = "^0.2.1"
redis = "^5.0.4"
asyncpg = "^0.29.0"
sqlalchemy = "^2.0.0"
alembic = "^1.16.4"
psycopg2-binary = "^2.9.9"
pandas = "^2.2.2"
networkx = "^3.3"
scikit-learn = "^1.4.2"
numpy = "^1.26.4"
pydantic = "^2.7.1"
pydantic-settings = "^2.3.0"
python-dotenv = "^1.0.1"
httpx = "^0.27.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
psutil = "^5.9.8"
python-multipart = "^0.0.9"
apscheduler = "^3.10.4"
leidenalg = "^0.9.1"
chromadb = "^0.5.0"
sentence-transformers = "^2.7.0"
firecrawl-python = "^0.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
pytest-mock = "^3.14.0"
black = "^24.4.2"
flake8 = "^7.0.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
